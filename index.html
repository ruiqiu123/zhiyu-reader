<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>知屿 · 公开资讯</title><meta name="description" content="知屿公开资讯阅读页，按分区、学校、信源和时间检索已发布内容。"><link rel="stylesheet" href="./reader.css?v=20261031-r75b"><script type="module" src="./reader.js?v=20261031-r75b"></script></head>

<main id="main"><header><div><p class="eyebrow">ZHIYU / PUBLIC READER</p><h1 id="title">公开资讯</h1><p id="description">按分区浏览已发布内容。</p></div><div class="updated" id="updated" aria-live="polite">正在读取公开资讯…</div></header>
<form class="search-bar" id="search-form" role="search"><label for="search">搜索公开资讯</label><div><input id="search" type="search" placeholder="搜索标题、信源、标签、嘉宾或地点" autocomplete="off"><button type="submit" class="primary">搜索</button></div></form>
<details class="advanced-filters" id="advanced" open><summary><strong>☷ 高级筛选</strong><span id="filter-summary">全部学校 · 全部信源</span></summary>
<form id="filter-form"><div class="advanced-grid">
<label>学校<select id="campus" name="campus"><option value="all">全部学校</option><option value="pku">北大</option><option value="thu">清华</option><option value="unknown">学校待确认</option></select></label>
<label>信源 · <span id="source-count">0</span> 个<input id="source-search" type="search" placeholder="输入名称查找信源" aria-label="搜索本分区信源"><select id="source_id" name="source_id" aria-label="信源"><option value="">全部信源</option></select></label>
<label data-section="career">就业类型<select name="career_category" id="career_category"><option value="">全部就业类型</option></select></label>
<label data-section="lectures">报告类型<select name="lecture_category" id="lecture_category"><option value="">全部报告类型</option></select></label>
<label data-section="industry">产业方向<select name="topic"><option value="">全部产业方向</option><option value="biomanufacturing">生物智造</option><option value="ai-for-science">AI for Science</option></select></label>
<label data-section="venture">内容类型<select name="type"><option value="">全部内容</option><option value="event">活动</option><option value="article_link">文章观点</option><option value="opportunity">报名机会</option></select></label>
<label data-activity>活动形式<select name="mode"><option value="all">全部形式</option><option value="online">线上</option><option value="offline">线下</option><option value="hybrid">混合</option><option value="unknown">形式待确认</option></select></label>
<label data-activity>有效性<select name="history"><option value="all">全部收录（含往期）</option><option value="future">当前有效</option><option value="past">往期与回放</option></select></label>
<label data-activity>活动时间完整度<select name="timing"><option value="all">全部时间信息</option><option value="known">有明确举办日期</option><option value="unknown">时间待核验</option></select></label>
<label data-reading>发布日期状态<select name="publish_timing"><option value="all">全部日期</option><option value="known">有发布日期</option><option value="unknown">发布日期待核实</option></select></label>
<label>核验范围<select name="quality"><option value="all">全部内容（含待核验）</option><option value="verified">仅已核验信息</option><option value="pending">需补充核验的信息</option></select></label>
<label>时间范围<select name="window" id="window"><option value="all">全部</option><option value="today">当天</option><option value="future_1">未来1天（明天）</option><option value="future_3">未来3天</option><option value="future_7">未来7天</option><option value="future_custom">自定义未来天数</option><option value="dates">自选日期范围</option></select></label>
<label id="future-field" hidden>未来天数<input name="future_days" type="number" min="1" max="365" value="3"></label>
<label class="date-field" hidden>开始日期<input name="date_from" type="date"></label><label class="date-field" hidden>结束日期<input name="date_to" type="date"></label>
<label>排列顺序<select name="sort"><option value="published">原文发布时间 · 从新到旧</option><option value="event_desc">举办时间优先 · 从新到旧</option><option value="event_asc">举办时间优先 · 从旧到新</option><option value="updated">收录更新时间 · 从新到旧</option></select></label>
<label>每页条目数<input name="page_size" type="number" min="1" max="100" step="1" value="20" required></label>
<label>主题关键词<input name="topic_query" maxlength="200" placeholder="多个关键词用逗号分隔"></label><label>包含主题<input name="include" maxlength="200"></label><label>排除词<input name="exclude" maxlength="200"></label>
<label data-activity>线下地点（线上不限）<input name="city" maxlength="200"></label>
<label>全文补读状态<select name="original_status"><option value="">全部补读状态</option><option value="read">文字与附件已读</option><option value="text_read">文字已读，附件待处理</option><option value="restricted">访问受限</option><option value="failed">读取失败</option></select></label>
</div><div class="filter-actions"><button type="submit" class="primary">应用筛选</button><button type="button" id="reset">重置筛选</button><span id="filter-note" role="status"></span></div><p class="filter-help">北京时间；未来天数从明天起算。按当前排列的时间字段筛选；举办时间排序在缺少举办日期时使用原文发布日期。搜索范围为公开标题、信源、标签、嘉宾和地点；原文仍通过原链接阅读。</p></form></details>
